<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f9ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="machineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#164e78;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bae6fd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1e3a5f" flood-opacity="0.18"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="48"/>

  <!-- Machine body -->
  <rect x="80" y="80" width="240" height="210" rx="28" fill="url(#machineGrad)" filter="url(#shadow)"/>

  <!-- Machine top panel -->
  <rect x="80" y="80" width="240" height="52" rx="28" fill="#164e78"/>
  <rect x="80" y="108" width="240" height="24" fill="#164e78"/>

  <!-- Top panel dots -->
  <circle cx="112" cy="106" r="8" fill="#0ea5e9" opacity="0.9"/>
  <circle cx="138" cy="106" r="5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="158" cy="106" r="4" fill="#7dd3fc" opacity="0.5"/>

  <!-- Power button -->
  <circle cx="295" cy="106" r="10" fill="#0f172a" opacity="0.4"/>
  <circle cx="295" cy="106" r="7" fill="#0ea5e9" opacity="0.9"/>

  <!-- Display bar -->
  <rect x="175" y="96" width="80" height="20" rx="6" fill="#0f172a" opacity="0.4"/>
  <rect x="178" y="99" width="40" height="14" rx="4" fill="#0ea5e9" opacity="0.7"/>

  <!-- Door circle outer ring -->
  <circle cx="200" cy="200" r="80" fill="#0f172a" opacity="0.25"/>
  <circle cx="200" cy="200" r="74" fill="url(#doorGrad)" stroke="#0ea5e9" stroke-width="3"/>

  <!-- Door inner ring -->
  <circle cx="200" cy="200" r="58" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Water/clothes swirl inside door -->
  <circle cx="200" cy="200" r="48" fill="#dbeafe" opacity="0.6"/>
  <!-- Swirl lines -->
  <path d="M174,185 Q186,172 200,178 Q214,184 215,200 Q216,216 200,222 Q184,228 177,215" fill="none" stroke="#0ea5e9" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M182,195 Q194,182 208,188 Q222,194 220,208" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Door handle -->
  <rect x="246" y="195" width="14" height="10" rx="5" fill="#0ea5e9"/>

  <!-- Bottom panel -->
  <rect x="92" y="268" width="216" height="10" rx="4" fill="#0f172a" opacity="0.2"/>

  <!-- Bubbles -->
  <circle cx="142" cy="310" r="12" fill="none" stroke="#0ea5e9" stroke-width="2.5" opacity="0.7"/>
  <circle cx="142" cy="310" r="5" fill="#bae6fd" opacity="0.5"/>
  <circle cx="175" cy="325" r="8" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <circle cx="230" cy="318" r="10" fill="none" stroke="#0ea5e9" stroke-width="2.5" opacity="0.65"/>
  <circle cx="260" cy="308" r="6" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.55"/>
  <circle cx="310" cy="175" r="9" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.4"/>
  <circle cx="330" cy="210" r="6" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <circle cx="68" cy="200" r="7" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.35"/>

  <!-- Brand text: rngzpos.laundry -->
  <text x="200" y="362" 
    font-family="'Arial Black', 'Impact', sans-serif" 
    font-size="34" 
    font-weight="900"
    fill="#1e3a5f" 
    text-anchor="middle"
    letter-spacing="-0.5">rngzpos<tspan fill="#0ea5e9">.laundry</tspan></text>

  <!-- Dot separator line -->
  <rect x="70" y="372" width="260" height="2.5" rx="2" fill="url(#accentGrad)" opacity="0.6"/>

  <!-- Sub text: SMART LAUNDRY SYSTEM -->
  <text x="200" y="392" 
    font-family="'Arial', sans-serif" 
    font-size="13" 
    font-weight="800"
    fill="#64748b" 
    text-anchor="middle"
    letter-spacing="3.5">SMART LAUNDRY SYSTEM</text>
</svg>
